receivers:
  snmp:  # <--- MUST be indented (2 spaces)
    endpoint: "udp://snmp:161"
    version: v2c
    community: "public"
    collection_interval: 30s
    metrics:
      system.uptime:
        unit: s
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.2.1.1.3.0"
      
      # Memory metrics (UCD-SNMP-MIB)
      system.memory.total:
        unit: "By"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.2021.4.5.0"
      
      system.memory.free:
        unit: "By"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.2021.4.6.0"
      
      system.memory.swap.total:
        unit: "By"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.2021.4.11.0"
      
      # CPU metrics (UCD-SNMP-MIB) - integer percentages
      system.cpu.user:
        unit: "%"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.2021.11.9.0"
      
      system.cpu.system:
        unit: "%"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.2021.11.10.0"
      
      system.cpu.idle:
        unit: "%"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.2021.11.11.0"
      
      # Note: Interface metrics (table-based) require more complex configuration
      # and may not be fully supported in this SNMP receiver version.
      # Interface metrics can be added later with proper column_oids syntax.

processors:
  batch: # <--- MUST be indented

exporters:
  otlp/elastic: # <--- MUST be indented
    endpoint: "https://a3ff8269278d4d3b97682a713da1146a.ingest.us-central1.gcp.elastic.cloud:443"
    headers:
      Authorization: "ApiKey NXoxVHJac0I3RFV3dVlERFJ2bzU6SUlEMnlXektPbTdJNFN2R3ZoaG1oQQ=="
    tls:
      insecure: false

  debug: # <--- MUST be indented
    verbosity: detailed

service:
  pipelines:
    metrics:
      receivers: [snmp]
      processors: [batch]
      exporters: [debug, otlp/elastic]
