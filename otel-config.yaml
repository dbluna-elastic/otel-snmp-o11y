receivers:
  snmp:  # <--- MUST be indented (2 spaces)
    endpoint: "udp://snmp:161"
    version: v2c
    community: "public"
    collection_interval: 30s
    metrics:
      system.uptime:
        unit: s
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.2.1.1.3.0"
      
      # Memory metrics (UCD-SNMP-MIB)
      system.memory.total:
        unit: "By"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.2021.4.5.0"
      
      system.memory.free:
        unit: "By"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.2021.4.6.0"
      
      system.memory.swap.total:
        unit: "By"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.2021.4.11.0"
      
      # CPU metrics (UCD-SNMP-MIB) - integer percentages
      system.cpu.user:
        unit: "%"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.2021.11.9.0"
      
      system.cpu.system:
        unit: "%"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.2021.11.10.0"
      
      system.cpu.idle:
        unit: "%"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.2021.11.11.0"
      
      # Network metrics - using scalar OIDs for aggregate values
      # Note: Table-based interface metrics (column_oids) require specific syntax
      # that may not be fully supported in this SNMP receiver version.
      # Using aggregate network statistics instead.
      
      network.interfaces.count:
        unit: "{interfaces}"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.2.1.2.1.0"

processors:
  resource:
    attributes:
      - key: agent.name
        value: "Otel-snmp-collector"
        action: upsert
  
  batch: # <--- MUST be indented

exporters:
  otlp/elastic: # <--- MUST be indented
    endpoint: ${env:ELASTIC_CLOUD_INGEST_ENDPOINT}
    headers:
      Authorization: ${env:ELASTIC_OTLP_AUTHORIZATION}
    tls:
      insecure: false

  debug: # <--- MUST be indented
    verbosity: detailed

service:
  pipelines:
    metrics:
      receivers: [snmp]
      processors: [resource, batch]
      exporters: [debug, otlp/elastic]
