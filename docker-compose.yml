services:
  snmp:
    build:
      context: .
      dockerfile: Dockerfile.snmp
    container_name: snmp-server
    ports:
      - "161:161/udp"
    networks:
      - otel-network
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "snmpget", "-v2c", "-c", "public", "localhost", "1.3.6.1.2.1.1.3.0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
    networks:
      - otel-network
    depends_on:
      snmp:
        condition: service_healthy
    restart: unless-stopped

networks:
  otel-network:
    driver: bridge
