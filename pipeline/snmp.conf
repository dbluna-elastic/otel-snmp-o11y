# Track A — Logstash SNMP poll + trap listener → Elastic Cloud
# Polls snmpsim for system + interface metrics; listens for traps on UDP/1162.
#
# Requires: logstash-integration-snmp (installed in Dockerfile.logstash)

input {
  snmp {
    hosts => [
      { host => "udp:snmpsim/161" community => "public" version => "2c" name => "core-switch-01" },
      { host => "udp:snmpsim/161" community => "recorded/linux-full-walk" version => "2c" name => "edge-router-01" },
      { host => "udp:snmpsim/161" community => "variation/multiplex" version => "2c" name => "access-switch-02" }
    ]
    get => [
      "1.3.6.1.2.1.1.1.0",
      "1.3.6.1.2.1.1.3.0",
      "1.3.6.1.2.1.1.5.0",
      "1.3.6.1.2.1.1.6.0"
    ]
    tables => [
      {
        name => "interfaces"
        columns => [
          "1.3.6.1.2.1.2.2.1.2",
          "1.3.6.1.2.1.2.2.1.7",
          "1.3.6.1.2.1.2.2.1.8",
          "1.3.6.1.2.1.2.2.1.10",
          "1.3.6.1.2.1.2.2.1.16"
        ]
      }
    ]
    interval => 30
    oid_root_skip => 6
    oid_map_field_values => true
    add_field => { "[event][dataset]" => "snmp.poll" }
  }

  snmptrap {
    port => 1162
    community => ["public"]
    add_field => { "[event][dataset]" => "snmp.trap" }
  }
}

filter {
  # Remove SNMP "no such instance" placeholders that break numeric ES mappings
  ruby {
    code => '
      event.to_hash.each do |k, v|
        next if k.start_with?("@")
        if v.is_a?(String) && v.include?("error: no such instance")
          event.remove(k)
        end
      end
    '
  }

  if [event][dataset] == "snmp.trap" {
    if [message] =~ /linkDown/ {
      mutate {
        add_field => { "[event][action]" => "link-down" }
        add_field => { "[event][severity]" => "4" }
      }
    }
    if [message] =~ /linkUp/ {
      mutate {
        add_field => { "[event][action]" => "link-up" }
        add_field => { "[event][severity]" => "2" }
      }
    }
  }

  mutate {
    add_field => { "[observer][vendor]" => "simulated" }
  }
}

output {
  if [event][dataset] == "snmp.trap" {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL}"]
      api_key => "${ES_API_KEY}"
      ssl_enabled => true
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "snmp"
      data_stream_namespace => "demo"
    }
  } else {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL}"]
      api_key => "${ES_API_KEY}"
      ssl_enabled => true
      data_stream => "true"
      data_stream_type => "metrics"
      data_stream_dataset => "snmp"
      data_stream_namespace => "demo"
    }
  }
}
